# Dependências locais dos dois robôs.
#
# - cobranca-sqlserver:  emula a base CASH_COBRANCA (Robô 1)
# - pagamento-sqlserver: emula a base ASA_CASH_PAGAMENTO (Robô 2)
#
# Azure SQL Edge em vez do SQL Server "real" pra funcionar em ARM64
# (Apple Silicon); mesmo protocolo T-SQL.
#
# As APIs externas (Gestor de Arquivos e conversor de layout) não têm
# emulação local — apontam pro ambiente de homologação real, e as base
# URLs em appsettings.json ainda estão como TODO(a-confirmar).
#
# Nenhum robô tem banco próprio: as duas bases são de outros times. A
# única tabela criada por este projeto é Pagamento.ControleJanelaRetorno
# (ver deploy/pagamento-controle-janela.sql).
#
# Uso:
#   docker compose -f docker-compose.local.yml up -d
#   dotnet run --project src/CnabRetorno.RemessaVan.Worker
#   dotnet run --project src/CnabRetorno.PagamentoRetorno.Worker
#
services:
  cobranca-sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cnab-cobranca-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev12345!"
    volumes:
      - ./.cobranca-sqlserver-data:/var/opt/mssql

  pagamento-sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cnab-pagamento-sqlserver
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev12345!"
    volumes:
      - ./.pagamento-sqlserver-data:/var/opt/mssql
