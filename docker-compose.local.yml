# Dependências locais do worker.
#
# - cobranca-sqlserver: emula a base CASH_COBRANCA (Cobranca.Arquivo +
#   Cobranca.DocumentoDados, que inclui a razão social do cliente — ver
#   DocumentoDados.ChaveRazaoSocial)
#
# Azure SQL Edge em vez do SQL Server "real" pra funcionar em ARM64
# (Apple Silicon); mesmo protocolo T-SQL.
#
# A API de conversão não tem emulação local — aponta pro ambiente de
# homologação real, e a base URL em appsettings.json ainda está como
# TODO(a-confirmar).
#
# A base é de outro time: o worker não cria nem migra nenhuma tabela.
#
# Uso:
#   docker compose -f docker-compose.local.yml up -d
#   dotnet run --project src/CnabRetorno.ExcelCnab.Worker
#
services:
  cobranca-sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cnab-cobranca-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev12345!"
    volumes:
      - ./.cobranca-sqlserver-data:/var/opt/mssql
